<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Paste Pal</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="Filter… " autofocus />
    <button id="settings" title="Edit entries">⚙</button>
  </header>

  <main>
    <ul id="entries"></ul>

    <section id="resumes-section" hidden>
      <h2>Resumes</h2>
      <ul id="resumes"></ul>
      <p class="hint">Right-click an upload area on any page → <b>Paste Pal → Attach resume</b>.</p>
    </section>

    <div id="empty" hidden>
      <p>No entries yet.</p>
      <button id="empty-settings">Open settings</button>
    </div>
  </main>

  <script src="../src/store.js"></script>
  <script src="panel.js"></script>
</body>
</html>
